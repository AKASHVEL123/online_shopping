services:

  db:
    image: mysql:8.0
    container_name: online-shopping-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: MyShop@123
      MYSQL_DATABASE: online_shopping_db

    volumes:
      - online_shopping_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pMyShop@123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build: .
    container_name: online-shopping-web
    restart: always

    ports:
      - "5001:5000"

    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: MyShop@123
      MYSQL_DATABASE: online_shopping_db
      MYSQL_PORT: 3306

    depends_on:
      db:
        condition: service_healthy

volumes:
  online_shopping_mysql_data: